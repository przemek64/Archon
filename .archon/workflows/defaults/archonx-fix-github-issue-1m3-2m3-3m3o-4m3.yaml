name: archonx-fix-github-issue-1m3-2m3-3m3o-4m3
description: |
  Use when: User wants to FIX/RESOLVE/IMPLEMENT a GitHub issue AND wants the
  implementation hardened by an adversarial self-verification loop where the
  evaluator is a GENUINELY DIFFERENT MIND than the generator before it proceeds
  to validation and PR creation.
  Triggers: "fix issue adversarially v2", "adv2 fix #123", "different-mind adversarial fix",
            "fix it with an opus evaluator", "cross-model adversarial fix".
  NOT for: Comprehensive multi-agent reviews (use archon-issue-review-full),
           questions about issues, CI failures, PR reviews, general exploration.
           Plain single-shot fixes (use archon-fix-github-issue).

  ARCHON2 M3 / OPUS-ADVERSARY VARIANT (naming: see .archon/workflows/NAMING.md).
  Cheap-base experiment: run the whole pipeline on MiniMax-M3 and spend the
  expensive model (Claude Opus) ONLY where it matters most — the adversarial
  evaluator. The adversarial loop runs GENERATOR and EVALUATOR on DIFFERENT
  providers via loop.roleModels ("fresh context AND different mind"):
    - GENERATOR  (phase = "building")   → pi/minimax/MiniMax-M3
    - EVALUATOR  (phase = "evaluating") → claude/opus
  Same blind spot can no longer pass its own work: the evaluator is a different,
  stronger mind than the builder. Combined with fresh_context, each role gets a
  fresh session on a different mind.

  Model routing:
    - investigate / plan run on pi/minimax/MiniMax-M3
    - negotiate-criteria, self-fix, simplify run on pi/minimax/MiniMax-M3
    - code-review, error-handling, test-coverage, comment-quality, docs-impact,
      synthesize run on pi/minimax/MiniMax-M3
    - adversarial EVALUATOR runs on claude/opus (the only expensive node)
    - everything else trivial (classify, web-research, create-pr, review-scope,
      review-classify, validate, report) stays on pi/MiniMax-M2.7

  Identical to labeltool's archon-fix-github-issue, EXCEPT Phase 4 (IMPLEMENT) is
  replaced by a GAN-style adversarial implementation loop (inspired by
  archon-adversarial-dev):
    a. negotiate-criteria — derives a concrete, testable acceptance CONTRACT from
       the GitHub issue body + investigation.md / plan.md.
    b. adversarial-implement — a fresh-context state machine that alternates
       GENERATOR (pi/MiniMax-M3: builds the fix in the worktree, commits, writes
       implementation.md) and EVALUATOR (claude/opus: read-only on source; runs
       tests; actively tries to BREAK the fix; scores every criterion 1-10). Any
       criterion below threshold loops back to the generator WITH the adversarial
       feedback, up to maxRetries.
  Downstream invariants preserved: the fix is committed to the worktree branch and
  $ARTIFACTS_DIR/implementation.md exists, so validate / project-gate / create-pr
  work unchanged.

  DAG workflow that:
  1. Classifies the issue (bug/feature/enhancement/etc)
  2. Researches context (web research + codebase exploration via investigate/plan)
  3. Routes to investigate (bugs) or plan (features) based on classification
  4. Negotiates an acceptance contract, then implements via the cross-model adversarial loop
  5. Runs the repo's project gate (.archon/gates.json) before PR creation
  6. Creates a draft PR using the repo's PR template
  7. Runs smart review (always code review + CLAUDE.md check, conditional additional agents)
  8. Aggressively self-fixes all findings (tests, docs, error handling)
  9. Simplifies changed code (implements fixes directly, not just reports)
  10. Reports results back to the GitHub issue with follow-up suggestions

provider: pi
model: minimax/MiniMax-M2.7

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: FETCH & CLASSIFY
  # ═══════════════════════════════════════════════════════════════

  - id: extract-issue-number
    prompt: |
      Find the GitHub issue number for this request.

      Request: $ARGUMENTS

      Rules:
      - If the message contains an explicit issue number (e.g., "#709", "issue 709", "709"), extract that number.
      - If the message is ambiguous (e.g., "fix the SQLite timestamp bug"), use `gh issue list` to search for matching issues and pick the best match.

      CRITICAL: Your final output must be ONLY the bare number with no quotes, no markdown, no explanation. Example correct output: 709

  - id: fetch-issue
    bash: |
      export PATH="$PATH:/home/user/.local/bin"
      # Strip quotes, whitespace, markdown backticks from AI output
      ISSUE_NUM=$(echo "$extract-issue-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      if [ -z "$ISSUE_NUM" ]; then
        echo "Failed to extract issue number from: $extract-issue-number.output" >&2
        exit 1
      fi
      gh issue view "$ISSUE_NUM" --json title,body,labels,comments,state,url,author
    depends_on: [extract-issue-number]

  # Derive the PR base branch from the issue's `target:` label.
  #   no label / "target: main" -> main ;  "target: <x>" -> feat/<x>
  - id: resolve-base-branch
    depends_on: [extract-issue-number, fetch-issue]
    bash: |
      export PATH="$PATH:/home/user/.local/bin"
      ISSUE_NUM=$(echo $extract-issue-number.output | grep -oE '[0-9]+' | head -1)
      TARGET=$(gh issue view "$ISSUE_NUM" --json labels -q '[.labels[].name | select(startswith("target: "))][0] // ""' | sed 's/^target: //')
      if [ -z "$TARGET" ] || [ "$TARGET" = "main" ]; then BR="main"; else BR="feat/$TARGET"; fi
      if ! git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
        echo "resolve-base-branch: base '$BR' (target='${TARGET:-none}') not on origin" >&2; exit 1
      fi
      # Repoint the worktree onto the resolved base BEFORE any node reads or writes
      # code, so investigation/implementation see the correct tree and the final PR
      # diff is scoped to this fix only. The GUI cuts the worktree from
      # worktree.baseBranch (.archon/config.yaml), which may not match this issue's
      # target: label — that mismatch is what produced the giant phantom-deletion
      # diffs. Safe here: this node runs early (investigate/plan/implement all
      # depend on it), so no implementation commits exist yet. Guard refuses to
      # repoint if uncommitted changes are present, in case the DAG is ever reordered.
      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "resolve-base-branch: uncommitted changes present; refusing destructive repoint" >&2; exit 1
      fi
      if ! git fetch origin "$BR" --quiet; then
        echo "resolve-base-branch: fetch origin/$BR failed" >&2; exit 1
      fi
      if ! git reset --hard "origin/$BR" >/dev/null 2>&1; then
        echo "resolve-base-branch: reset to origin/$BR failed" >&2; exit 1
      fi
      echo "resolve-base-branch -> $BR (worktree repointed)" >&2
      printf '%s' "$BR"

  - id: classify
    prompt: |
      You are an issue classifier. Analyze the GitHub issue below and determine its type.

      ## Issue Content

      $fetch-issue.output

      ## Classification Rules

      | Type | Indicators |
      |------|------------|
      | bug | "broken", "error", "crash", "doesn't work", stack traces, regression |
      | feature | "add", "new", "support", "would be nice", net-new capability |
      | enhancement | "improve", "better", "update existing", "extend", incremental improvement |
      | refactor | "clean up", "simplify", "reorganize", "restructure" |
      | chore | "update deps", "upgrade", "maintenance", "CI/CD" |
      | documentation | "docs", "readme", "clarify", "examples" |

      Provide reasoning for your classification.
    depends_on: [fetch-issue]
    allowed_tools: []
    output_format:
      type: object
      properties:
        issue_type:
          type: string
          enum: ["bug", "feature", "enhancement", "refactor", "chore", "documentation"]
        title:
          type: string
        reasoning:
          type: string
      required: [issue_type, title, reasoning]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: RESEARCH (parallel with PR template fetch)
  # ═══════════════════════════════════════════════════════════════

  - id: web-research
    command: archon-web-research
    depends_on: [classify]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: INVESTIGATE (bugs) / PLAN (features)
  #   m3/opus: pi/minimax/MiniMax-M3
  # ═══════════════════════════════════════════════════════════════

  - id: investigate
    provider: pi
    model: minimax/MiniMax-M3
    command: archon-investigate-issue
    depends_on: [classify, web-research, resolve-base-branch]
    when: "$classify.output.issue_type == 'bug'"
    context: fresh

  - id: plan
    provider: pi
    model: minimax/MiniMax-M3
    command: archon-create-plan
    depends_on: [classify, web-research, resolve-base-branch]
    when: "$classify.output.issue_type != 'bug'"
    context: fresh

  # Bridge: ensure investigation.md exists for the implement step
  # archon-fix-issue reads from $ARTIFACTS_DIR/investigation.md
  # archon-create-plan writes to $ARTIFACTS_DIR/plan.md
  # This node copies plan.md → investigation.md when the plan path was taken
  - id: bridge-artifacts
    bash: |
      if [ -f "$ARTIFACTS_DIR/plan.md" ] && [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then
        cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/investigation.md"
        echo "Bridged plan.md to investigation.md for implement step"
      elif [ -f "$ARTIFACTS_DIR/investigation.md" ]; then
        echo "investigation.md exists from investigate step"
      else
        echo "WARNING: No investigation.md or plan.md found — implement may fail"
      fi
    depends_on: [investigate, plan]
    trigger_rule: one_success

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: ADVERSARIAL IMPLEMENT (cross-model "different mind")
  #   4a. negotiate-criteria  → derive acceptance contract    (m3/opus: M3)
  #   4b. init-impl-state     → state machine seed           (bash)
  #   4c. adversarial-implement → generator ↔ evaluator loop
  #         GENERATOR  (building)   → pi/minimax/MiniMax-M3
  #         EVALUATOR  (evaluating) → claude/opus   (different, stronger mind)
  # ═══════════════════════════════════════════════════════════════

  # 4a. Derive a concrete, testable acceptance contract from the issue + plan.
  #     This is the "oracle" the evaluator scores against — the handoff root-cause
  #     for Archon drift was that no executable acceptance criteria existed, so a
  #     wrong implementation could not fail. The contract fixes that.
  - id: negotiate-criteria
    provider: pi
    model: minimax/MiniMax-M3
    prompt: |
      You define the acceptance CONTRACT for fixing this GitHub issue. The contract
      is what an adversarial evaluator will later score the implementation against,
      so it must be concrete, testable, and faithful to the issue — NOT to whatever
      the implementer happens to build.

      ## GitHub Issue

      $fetch-issue.output

      ## Classification

      $classify.output

      ## Investigation / Plan

      Read `$ARTIFACTS_DIR/investigation.md` (it exists — it is either the bug
      investigation or the bridged feature plan). Treat the issue body as the
      AUTHORITATIVE spec; the investigation is the proposed approach.

      ## Your Task — play BOTH sides, sequentially

      **Step 1 — Proposer:** Extract every requirement the issue states. Capture
      positive requirements (what must happen), constraints (what must NOT happen or
      must stay unchanged), and edge cases — each as a first-class criterion. Propose
      5-15 criteria.

      **Step 2 — Adversary:** Re-read each criterion and ask: is it specific enough
      to verify programmatically? Could a sloppy happy-path implementation pass it?
      Tighten vague criteria, add the missing edge cases, raise the bar. If the issue
      contains a literal expected-output / golden block, turn it into an exact-match
      criterion.

      Each criterion MUST be concrete and verifiable. Examples:
      - GOOD: "GET /api/items returns 200 with a JSON array; each item has id and name"
      - GOOD: "Submitting the form with an empty title shows a validation error and does not save"
      - BAD: "The feature works correctly"

      Write the final contract to `$ARTIFACTS_DIR/contracts/impl.json` using the Write tool:
      ```json
      {
        "issue": "<number>",
        "criteria": [
          { "name": "short-kebab-name",
            "description": "Specific, testable statement of what must be true",
            "verify": "How an evaluator would check it (command to run, output to inspect, file to read)",
            "threshold": 7 }
        ]
      }
      ```

      Then return the same JSON as your structured output.
    depends_on: [bridge-artifacts]
    context: fresh
    allowed_tools: [Read, Write, Glob, Grep, Bash]
    output_format:
      type: object
      properties:
        issue:
          type: string
        criteria:
          type: array
          items:
            type: object
            properties:
              name:        { type: string }
              description: { type: string }
              verify:      { type: string }
              threshold:   { type: number }
            required: [name, description, verify, threshold]
      required: [issue, criteria]

  # 4b. Seed the implementation state machine.
  - id: init-impl-state
    depends_on: [negotiate-criteria]
    bash: |
      mkdir -p "$ARTIFACTS_DIR/feedback"
      cat > "$ARTIFACTS_DIR/impl-state.json" << 'STATEEOF'
      {
        "phase": "building",
        "retry": 0,
        "maxRetries": 3,
        "passThreshold": 7,
        "status": "running"
      }
      STATEEOF
      echo "impl-state.json seeded"
    timeout: 30000

  # 4c. The adversarial implementation loop. UNLIKE the single-model variant, the
  #     generator and evaluator run on DIFFERENT providers via loop.roleModels:
  #     the builder is pi/MiniMax-M3, the evaluator is claude/opus. Each iteration also
  #     gets a FRESH session (fresh_context), so the evaluator neither remembers
  #     being the generator NOR shares its model's blind spots — a genuinely
  #     independent adversary. The node-level provider/model below is only the
  #     fallback used if the state file/field is missing.
  - id: adversarial-implement
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [init-impl-state]
    idle_timeout: 600000
    loop:
      # Per-role model selection: read `phase` from impl-state.json each iteration
      # and run that role on its own provider/model. building = pi/M3 (builder),
      # evaluating = claude/opus (different-mind adversary). Missing file/field on
      # the first iteration falls back to `default` (the builder).
      roleModels:
        stateFile: $ARTIFACTS_DIR/impl-state.json
        field: phase
        map:
          building:   { provider: pi,     model: minimax/MiniMax-M3 }
          evaluating: { provider: claude, model: opus }
        default:      { provider: pi,     model: minimax/MiniMax-M3 }
      prompt: |
        # Adversarial Implementation — Generator ↔ Evaluator (cross-model)

        You play ONE role this iteration, determined by `phase` in the state file.
        The generator and evaluator run on DIFFERENT models — you are whichever role
        `phase` says, and your adversary is a different mind. The "app" is the REAL
        repository worktree you are running in (current directory) — NOT a throwaway
        sandbox. Changes you commit land on the issue branch and become the PR.

        ## FIRST: Read State
        Read `$ARTIFACTS_DIR/impl-state.json`:
        - `phase` — "building" (Generator) or "evaluating" (Evaluator)
        - `retry` — current retry attempt (0 = first try)
        - `maxRetries` — max retries before giving up (default 3)
        - `passThreshold` — minimum score to pass (default 7)

        Then read:
        - `$ARTIFACTS_DIR/contracts/impl.json` — the acceptance contract (authoritative)
        - `$ARTIFACTS_DIR/investigation.md` — investigation / plan (the approach)

        ---

        ## ROLE: GENERATOR (phase = "building")

        You are a software engineer implementing the fix so it SURVIVES an adversarial
        evaluator — a DIFFERENT model — who will actively try to break it against every
        contract criterion.

        **If this is a RETRY (retry > 0):** read the most recent
        `$ARTIFACTS_DIR/feedback/round-{retry-1}.json` and address EVERY failed
        criterion. If scores were 5-6 and rising, refine; if 1-4 or fundamentally
        wrong, pivot.

        **Build rules:**
        - Follow the investigation/plan, but the CONTRACT wins on conflicts.
        - Honor the repo's conventions and any CLAUDE.md rules.
        - Satisfy EVERY criterion in the contract — including constraints and edge
          cases, not just the happy path. The evaluator will check all of them.
        - Run the code yourself before committing. Verify each criterion's `verify`
          step actually passes for you.
        - Stage ONLY the files you edited — never `git add -A`/`.`/`-u`. Then commit:
          `git add <file1> <file2> ... && git commit -m "fix: <what changed> (#<issue>)"`
        - Do NOT stage anything under `$ARTIFACTS_DIR`, `*.scratch.md`, `*-report.md`.

        **Write/refresh** `$ARTIFACTS_DIR/implementation.md` — files changed, tasks
        done, how each contract criterion is satisfied, any deviations. (Downstream
        PR creation reads this file, so it must always exist after you run.)

        **Update impl-state.json:** set `"phase": "evaluating"`. Keep other fields.

        ---

        ## ROLE: EVALUATOR (phase = "evaluating")

        You are an ADVERSARIAL QA agent, and a DIFFERENT model than the one that built
        this. Your mandate is to BREAK the implementation. You are not helpful, not
        generous — you are an attacker, and you do not share the builder's assumptions.

        **CRITICAL CONSTRAINTS:**
        - READ-ONLY on source. NEVER use Write/Edit on repository source files. (You
          MAY write only to `$ARTIFACTS_DIR/feedback/`.)
        - You MAY use Bash to run the app, run the test suite, diff outputs, probe edge
          cases. Kill any background process you start before finishing.
        - Score EVERY criterion in `$ARTIFACTS_DIR/contracts/impl.json`. No skipping.

        **Scoring:** 9-10 exceptional (handles unstated edges) · 7-8 solid (meets the
        criterion) · 5-6 partial (core works, fails edges/has bugs) · 3-4 weak · 1-2
        broken/absent. Do NOT grade on a curve. A 7 means "genuinely meets the bar."

        **For each criterion:** read the relevant source, run its `verify` step, then
        try to break it (invalid inputs, boundary values, error paths, and the
        golden output if one exists). Score honestly.

        **Write** `$ARTIFACTS_DIR/feedback/round-{retry}.json`:
        ```json
        {
          "passed": <true iff ALL scores >= passThreshold>,
          "scores": { "criterion-name": <score>, ... },
          "feedback": [
            { "criterion": "criterion-name", "score": <1-10>,
              "details": "Specific findings: file:line, exact command run, exact output vs expected." }
          ],
          "overallSummary": "What works, what is broken, what the generator must fix."
        }
        ```

        **Update impl-state.json by result:**
        - PASSED (every score >= threshold): set `"status": "passed"`.
        - FAILED & `retry` < `maxRetries`: set `"phase": "building"`, increment `"retry"` by 1.
        - FAILED & `retry` >= `maxRetries`: set `"status": "exhausted"`.

        Kill any background processes before finishing.

        ---

        ## COMPLETION
        After updating impl-state.json, check `status`:
        - `"passed"`    → Output: `<promise>IMPL_DONE</promise>`
        - `"exhausted"` → the loop gave up; the latest implementation + feedback stand
                          (downstream review/self-fix will still run). Output: `<promise>IMPL_DONE</promise>`
        - `"running"`   → more work to do. Do NOT output any completion signal.

      until: IMPL_DONE
      max_iterations: 16
      fresh_context: true
      until_bash: |
        grep -qE '"status"\s*:\s*"(passed|exhausted)"' "$ARTIFACTS_DIR/impl-state.json"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: VALIDATE
  # ═══════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [adversarial-implement]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5b: PROJECT GATE (generic, data-driven — reads .archon/gates.json)
  #   labeltool override: runs the repo's own gates (print-engine-unit-tests,
  #   converter-unit-tests, converter-oracle). Each gate is path-scoped via
  #   when_paths and runs only if the diff (BASE_BRANCH...HEAD) touches a match.
  #   No gates.json → vacuous pass. Any selected gate exiting nonzero fails this
  #   node, blocking create-pr and downstream. stdlib json + git only.
  # ═══════════════════════════════════════════════════════════════
  - id: project-gate
    depends_on: [validate, resolve-base-branch]
    bash: |
      set -uo pipefail
      [ -f .archon/gates.json ] || { echo "No .archon/gates.json — skipping project gate."; exit 0; }
      BASE=$resolve-base-branch.output
      echo "Project gate base: $BASE"
      CHANGED=$(git diff --name-only "$BASE...HEAD")
      echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
      PY=python3; "$PY" -c '' >/dev/null 2>&1 || PY=python
      "$PY" - "$CHANGED" << 'PYEOF'
      import json, sys, subprocess, fnmatch, os
      changed = [l for l in sys.argv[1].splitlines() if l.strip()]
      gates = json.load(open(".archon/gates.json"))["gates"]
      def hit(p):
          # "*"/"**" => all; pattern without "/" => match basename; else full-path fnmatch
          if p in ("*", "**"): return True
          if "/" not in p: return any(fnmatch.fnmatch(os.path.basename(f), p) for f in changed)
          return any(fnmatch.fnmatch(f, p) for f in changed)
      failed = []
      for g in gates:
          if not any(hit(p) for p in g.get("when_paths", ["*"])):
              print(f"[skip] {g['name']} (no matching changed paths)"); continue
          print(f"[run ] {g['name']}: {g['run']}")
          rc = subprocess.run(g["run"], shell=True).returncode
          print(f"[{'pass' if rc == 0 else 'FAIL'}] {g['name']} (exit {rc})")
          if rc != 0: failed.append(g["name"])
      if failed:
          print("PROJECT GATE FAILED:", ", ".join(failed)); sys.exit(1)
      print("PROJECT GATE PASSED")
      PYEOF

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: CREATE DRAFT PR
  # ═══════════════════════════════════════════════════════════════

  - id: create-pr
    prompt: |
      Create a draft pull request for the current branch.

      ## Context

      - **Issue**: $ARGUMENTS
      - **Classification**: $classify.output
      - **Issue title**: $classify.output.title

      ## Instructions

      1. Clean up runtime-generated files, then commit ONLY the implementation's own changes:
         - Archon may sync its bundled default workflows into this worktree. Discard them so they never reach the PR:
           `git checkout -- .archon/ 2>/dev/null; git clean -fd .archon/ 2>/dev/null`
         - Run `git status`. The adversarial loop already committed the fix. If — and only if — source files the
           implementation actually edited remain uncommitted, stage those specific files BY PATH and commit them.
           NEVER use `git add -A` / `git add .` / `git add -u`, and never stage anything under `.archon/`,
           `$ARTIFACTS_DIR`, `*.scratch.md`, or `*-report.md`.
      2. Push the branch: `git push -u origin HEAD`
      3. Read implementation artifacts from `$ARTIFACTS_DIR/` for context:
         - `$ARTIFACTS_DIR/investigation.md` or `$ARTIFACTS_DIR/plan.md`
         - `$ARTIFACTS_DIR/implementation.md`
         - `$ARTIFACTS_DIR/contracts/impl.json` (acceptance contract) and the latest `$ARTIFACTS_DIR/feedback/round-*.json` (adversarial verdict)
         - `$ARTIFACTS_DIR/validation.md`
      4. Check if a PR already exists for this branch: `gh pr list --head $(git branch --show-current)`
         - If PR exists, skip creation and capture its number
      5. Look for the project's PR template at `.github/pull_request_template.md`, `.github/PULL_REQUEST_TEMPLATE.md`, or `docs/PULL_REQUEST_TEMPLATE.md`. Read whichever one exists.
      6. Create a DRAFT PR: `gh pr create --draft --base $resolve-base-branch.output`
         - Title: concise, imperative mood, under 70 chars
         - Body: if a PR template was found, fill in **every section** with details from the artifacts. Don't skip sections or leave placeholders. If no template, write a body with summary, changes, validation evidence, the adversarial acceptance verdict (which criteria passed and final scores), and `Fixes #...`.
         - Link to issue: include `Fixes #...` or `Closes #...`
      7. Capture PR identifiers:
         ```bash
         PR_NUMBER=$(gh pr view --json number -q '.number')
         echo "$PR_NUMBER" > "$ARTIFACTS_DIR/.pr-number"
         PR_URL=$(gh pr view --json url -q '.url')
         echo "$PR_URL" > "$ARTIFACTS_DIR/.pr-url"
         ```
    depends_on: [project-gate, resolve-base-branch]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: REVIEW
  # ═══════════════════════════════════════════════════════════════

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [create-pr]
    context: fresh

  - id: review-classify
    prompt: |
      You are a PR review classifier. Analyze the PR scope and determine
      which review agents should run.

      ## PR Scope

      $review-scope.output

      ## Rules

      - **Code review**: ALWAYS run. This is mandatory for every PR. It also checks
        the PR against CLAUDE.md rules and project conventions.
      - **Error handling**: Run if the diff touches code with try/catch, error handling,
        async/await, or adds new failure paths.
      - **Test coverage**: Run if the diff touches source code (not just tests, docs, or config).
      - **Comment quality**: Run if the diff adds or modifies comments, docstrings, JSDoc,
        or significant documentation within code files.
      - **Docs impact**: Run if the diff adds/removes/renames public APIs, commands, CLI flags,
        environment variables, or user-facing features.

      Provide your reasoning for each decision.
    depends_on: [review-scope]
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        reasoning:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - reasoning

  # Code review always runs — mandatory
  - id: code-review
    command: archon-code-review-agent
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [review-classify]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [review-classify]
    when: "$review-classify.output.run_error_handling == 'true'"
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [review-classify]
    when: "$review-classify.output.run_test_coverage == 'true'"
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [review-classify]
    when: "$review-classify.output.run_comment_quality == 'true'"
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [review-classify]
    when: "$review-classify.output.run_docs_impact == 'true'"
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: SYNTHESIZE + SELF-FIX
  #   m3/opus: self-fix on pi/minimax/MiniMax-M3
  # ═══════════════════════════════════════════════════════════════

  - id: synthesize
    command: archon-synthesize-review
    provider: pi
    model: minimax/MiniMax-M3
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  - id: self-fix
    provider: pi
    model: minimax/MiniMax-M3
    command: archon-self-fix-all
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: SIMPLIFY
  #   m3/opus: simplify on pi/minimax/MiniMax-M3
  # ═══════════════════════════════════════════════════════════════

  - id: simplify
    provider: pi
    model: minimax/MiniMax-M3
    command: archon-simplify-changes
    depends_on: [self-fix]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # PHASE 10: REPORT
  # ═══════════════════════════════════════════════════════════════

  - id: report
    command: archon-issue-completion-report
    depends_on: [simplify]
    context: fresh
