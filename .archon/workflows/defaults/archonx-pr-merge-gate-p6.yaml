name: archonx-pr-merge-gate-p6
description: |
  grey-factory stage P6 — the MECHANICAL merge gate. Reads the structured verdict the
  p5 spec-review posted (`<!-- gf-verdict:p5 … -->`) and makes a DETERMINISTIC merge
  decision — no new LLM judgment. Mergeable iff the review actually completed AND there
  are no CRITICAL/HIGH blocking findings. On mergeable: opens ONE deduped follow-up
  issue for the deferrable minor findings, posts the p6 marker, and (phase 1) recommends
  a human merge — or (phase 2, ARCHON_P6_AUTOMERGE=1) merges the PR. On HOLD: posts the
  blocking reasons and FAILS the run (no p6 marker) so the orchestrator parks p6:blocked.

  Design: docs/PLAN_merge-gate-p6.md. Runner: pr-workflow (ARGUMENTS = PR number).
  Fully mechanical — providers = []. Read-only on source; never edits the diff.

  NOT for: reviewing (that is p5), implementing (p2), planning (p1).

provider: pi
model: minimax/MiniMax-M2.7   # unused — every node is deterministic bash; no model call

nodes:
  # ── Resolve PR, base, head, linked issue, owner/repo ──
  - id: fetch-pr
    bash: |
      export PATH="$PATH:/home/user/.local/bin"
      set -uo pipefail
      # win-path stopgap: $ARTIFACTS_DIR is a Windows backslash path; bash -c eats the
      # backslashes (mangles `C:\Users\…` -> `C:Users…`). Normalize to a POSIX path for
      # all SHELL file ops. (Python nodes read os.environ["ARTIFACTS_DIR"] directly — unaffected.)
      A=$(cygpath -u "$ARTIFACTS_DIR" 2>/dev/null || printf '%s' "$ARTIFACTS_DIR")
      mkdir -p "$A"
      PR=$(echo "${ARGUMENTS:-}" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+' | head -1)
      [ -n "$PR" ] || PR=$(echo "${ARGUMENTS:-}" | grep -oE '[0-9]+' | head -1)
      [ -n "$PR" ] || PR=$(gh pr view --json number -q '.number' 2>/dev/null)
      echo "$PR" | grep -qE '^[0-9]+$' || { echo "FATAL: no PR number in ARGUMENTS=${ARGUMENTS:-}" >&2; exit 1; }
      echo "$PR" > "$A/.pr-number"
      gh repo view --json nameWithOwner -q '.nameWithOwner' > "$A/.repo"
      gh pr view "$PR" --json baseRefName -q '.baseRefName' > "$A/.pr-base"
      gh pr view "$PR" --json headRefName -q '.headRefName' > "$A/.pr-head"
      BODY=$(gh pr view "$PR" --json body -q '.body')
      ISSUE=$(echo "$BODY" | grep -oiE '(fix|fixe[sd]|close[sd]?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | head -1)
      [ -n "$ISSUE" ] || ISSUE=$(echo "$BODY" | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | head -1)
      echo "${ISSUE:-}" > "$A/.issue-number"
      echo "p6 merge-gate: PR #$PR base=$(cat "$A/.pr-base") issue=#${ISSUE:-none}"

  # ── Read the LATEST gf-verdict:p5 block (across PR comments AND review bodies). Fail-closed. ──
  - id: read-verdict
    depends_on: [fetch-pr]
    timeout: 60000
    bash: |
      export PATH="$PATH:/home/user/.local/bin"
      set -uo pipefail
      A=$(cygpath -u "$ARTIFACTS_DIR" 2>/dev/null || printf '%s' "$ARTIFACTS_DIR")
      PR=$(cat "$A/.pr-number"); REPO=$(cat "$A/.repo")
      # PR issue-comments + review bodies — p5 posts via `gh pr review` (a review body).
      gh pr view "$PR" --repo "$REPO" --json comments -q '.comments[].body' > "$A/.allbodies" 2>/dev/null || true
      gh api "repos/$REPO/pulls/$PR/reviews" -q '.[].body' >> "$A/.allbodies" 2>/dev/null || true
      PY=python3; "$PY" -c '' >/dev/null 2>&1 || PY=python
      "$PY" - << 'PYEOF'
      import json, os, re, sys
      A = os.environ["ARTIFACTS_DIR"]
      text = open(os.path.join(A, ".allbodies"), encoding="utf-8", errors="replace").read()
      blocks = re.findall(r'<!--\s*gf-verdict:p5\s*(\{.*?\})\s*-->', text, re.S)
      if not blocks:
          print("HOLD: no gf-verdict:p5 block found on the PR (p5 not run, or pre-verdict p5).", file=sys.stderr)
          sys.exit(3)
      try:
          v = json.loads(blocks[-1])  # latest wins
      except Exception as e:
          print(f"HOLD: gf-verdict:p5 block is not valid JSON: {e}", file=sys.stderr)
          sys.exit(3)
      if v.get("schema") != "gf-verdict/1":
          print(f"HOLD: unexpected verdict schema {v.get('schema')!r}", file=sys.stderr)
          sys.exit(3)
      # ── Narrow, deterministic loosening (NOT a general re-bucket) ──
      # The VERSION-bump / `.archive`-copy convention is LOW and NEVER a merge blocker
      # (labeltool CLAUDE.md Learned Rules §1). Reviewers keep mis-flagging it HIGH/MEDIUM
      # and dumping it into blocking[]. Demote ONLY that convention out of blocking into
      # deferrable; every other finding (incl. unrelated MEDIUMs) is left exactly as-is.
      # Matches the convention however reviewers phrase it: VERSION bump/increment/patch,
      # the literal `.archive` path, "archive copy", the "Version/Archive" pairing (slash or
      # space), and "frozen snapshot" copies. Kept narrow to this one convention.
      _CONV_RE = re.compile(
          r'VERSION.{0,60}(?:increment|patch|bump)'
          r'|(?:increment|patch|bump).{0,60}VERSION'
          r'|\.archive\b'
          r'|archive\s+cop(?:y|ies)'
          r'|version\s*[/\\&+]{1,3}\s*archive'          # "Version/Archive", "Version & Archive"
          r'|version\s+and\s+archive'
          r'|frozen\s+snapshot\s+cop(?:y|ies)',
          re.I | re.S)
      _kept, _moved = [], []
      for _it in v.get("blocking", []):
          if _CONV_RE.search(_it.get("text", "")):
              _it["severity"] = "LOW"
              _it["demoted"] = "version/.archive convention (CLAUDE.md Learned Rules §1): LOW, never blocking"
              _moved.append(_it)
          else:
              _kept.append(_it)
      if _moved:
          v["blocking"] = _kept
          v.setdefault("deferrable", []).extend(_moved)
          print("demoted %d version/.archive convention finding(s) blocking->deferrable"
                % len(_moved), file=sys.stderr)
      open(os.path.join(A, "p5-verdict.json"), "w", encoding="utf-8").write(json.dumps(v, indent=2))
      print("verdict read: reviewed_all=%s blocking=%d deferrable=%d"
            % (v.get("reviewed_all"), len(v.get("blocking", [])), len(v.get("deferrable", []))))
      PYEOF

  # ── Decide + act. Mergeable => follow-up issue + p6 marker + (phase2) merge. Else HOLD + exit 1. ──
  - id: decide-and-act
    depends_on: [read-verdict]
    timeout: 120000
    bash: |
      export PATH="$PATH:/home/user/.local/bin"
      set -uo pipefail
      A=$(cygpath -u "$ARTIFACTS_DIR" 2>/dev/null || printf '%s' "$ARTIFACTS_DIR")
      PR=$(cat "$A/.pr-number"); REPO=$(cat "$A/.repo")
      ISSUE=$(cat "$A/.issue-number"); BASE=$(cat "$A/.pr-base")
      PY=python3; "$PY" -c '' >/dev/null 2>&1 || PY=python

      # MECHANICAL gate: mergeable iff review completed AND no CRITICAL/HIGH blocking.
      MERGEABLE=$("$PY" - << 'PYEOF'
      import json, os
      A = os.environ["ARTIFACTS_DIR"]
      v = json.load(open(os.path.join(A, "p5-verdict.json"), encoding="utf-8"))
      print("yes" if (v.get("reviewed_all") and not v.get("blocking")) else "no")
      PYEOF
      )

      # Render the human-readable decision body + verdict block (mechanical).
      "$PY" - "$PR" "$ISSUE" "$MERGEABLE" << 'PYEOF'
      import json, os, sys
      A = os.environ["ARTIFACTS_DIR"]
      pr, issue, mergeable = sys.argv[1], sys.argv[2], sys.argv[3]
      v = json.load(open(os.path.join(A, "p5-verdict.json"), encoding="utf-8"))
      def fmt(items):
          return "\n".join(f"- `{f['req']}` [{f['severity']}/{f['status']}] {f['text']}" for f in items) or "- (none)"
      decision = "merge" if mergeable == "yes" else "hold"
      lines = [f"# p6 merge-gate: {'MERGE-RECOMMENDED' if decision=='merge' else 'HOLD'}",
               "",
               f"PR #{pr} · issue #{issue} · verdict `{v.get('verdict')}` · reviewed {v['counts']['reviewed']}/{v['counts']['total']}",
               "",
               "**Blocking (CRITICAL/HIGH):**", fmt(v.get("blocking", [])),
               "",
               "**Deferrable (MEDIUM/LOW):**", fmt(v.get("deferrable", [])),
               "",
               "**Stubs (dependency-gated):**", fmt(v.get("stubs", []))]
      if decision == "hold" and not v.get("reviewed_all"):
          lines += ["", "_Review did not complete (reviewed_all=false) — not mergeable._"]
      open(os.path.join(A, "p6-body.md"), "w", encoding="utf-8").write("\n".join(lines) + "\n")
      # follow-up issue body (only used on the mergeable path)
      fu = [f"<!-- gf-followup:issue-{issue} -->",
            f"Follow-up for residual minor findings from PR #{pr} (issue #{issue}).",
            "", "**Depends-on:** #" + str(issue),
            "", "## Deferrable findings", fmt(v.get("deferrable", [])),
            "", "## Stubs (dependency-gated)", fmt(v.get("stubs", []))]
      open(os.path.join(A, "p6-followup.md"), "w", encoding="utf-8").write("\n".join(fu) + "\n")
      print(decision)
      PYEOF

      if [ "$MERGEABLE" = "no" ]; then
        # LEGITIMATE HOLD: review completed with CRITICAL/HIGH blocking findings.
        # Post reasons WITHOUT a gf-stage:p6 marker so the artifact stays absent and the
        # orchestrator keeps parking p6:blocked (reap is artifact-derived, NOT run-status
        # derived — see reap() step 4 + executions_since, which never inspect status).
        # EXIT 0 so a clean hold reads "completed" (green), not "failed" (red): red is now
        # reserved for a genuine crash, so triage can tell the two apart at a glance.
        # Leave a p6-hold.json breadcrumb (distinct from the gf-stage:p6 advance-marker)
        # for anyone reading the artifacts dir.
        gh pr comment "$PR" --repo "$REPO" --body-file "$A/p6-body.md" || true
        "$PY" -c "import json,os;v=json.load(open(os.path.join(os.environ['ARTIFACTS_DIR'],'p5-verdict.json')));json.dump({'schema':'gf-hold/1','stage':'p6','pr':int('$PR'),'issue':int('$ISSUE' or 0),'verdict':v.get('verdict'),'blocking':v.get('blocking',[])},open(os.path.join(os.environ['ARTIFACTS_DIR'],'p6-hold.json'),'w'),indent=2)" || true
        echo "p6: HOLD — not mergeable (blocking findings; see PR comment). Clean hold; orchestrator parks p6:blocked via artifact-absence."
        exit 0
      elif [ "$MERGEABLE" != "yes" ]; then
        # Verdict could not be read (MERGEABLE is neither yes nor no) -> genuine error.
        # FAIL (red) so it's not mistaken for a clean hold and retries/surfaces.
        echo "p6: ERROR — could not read p5 verdict (MERGEABLE='$MERGEABLE'). Failing run."
        exit 1
      fi

      # ── MERGEABLE ──
      # Follow-up issue for deferrable residuals (deduped by marker), if any exist.
      NDEF=$("$PY" -c 'import json,os;v=json.load(open(os.path.join(os.environ["ARTIFACTS_DIR"],"p5-verdict.json")));print(len(v.get("deferrable",[]))+len(v.get("stubs",[])))')
      FOLLOWUP=""
      if [ "$NDEF" -gt 0 ] && [ -n "$ISSUE" ]; then
        EXIST=$(gh issue list --repo "$REPO" --state open -S "gf-followup:issue-$ISSUE in:body" --json number -q '.[0].number' 2>/dev/null || true)
        if [ -n "$EXIST" ]; then
          gh issue comment "$EXIST" --repo "$REPO" --body "Re-checked at p6 for PR #$PR; residuals still open (see latest p5 verdict)." || true
          FOLLOWUP="#$EXIST"
        else
          # carry the same target: label as the parent so it merges to the right branch when worked.
          TGT=$(gh issue view "$ISSUE" --repo "$REPO" --json labels -q '.labels[].name' 2>/dev/null | grep -E '^target:' | head -1 || true)
          LBL=""; [ -n "$TGT" ] && LBL="--label \"$TGT\""
          TITLE="Follow-up: residual findings from #$ISSUE (PR #$PR)"
          NEW=$(eval gh issue create --repo "\"$REPO\"" --title "\"$TITLE\"" --body-file "\"$A/p6-followup.md\"" $LBL --json url -q '.url' 2>/dev/null || \
                eval gh issue create --repo "\"$REPO\"" --title "\"$TITLE\"" --body-file "\"$A/p6-followup.md\"" $LBL 2>/dev/null)
          FOLLOWUP="$NEW"
        fi
      fi

      # Post the p6 decision comment WITH the gf-stage marker + gf-verdict:p6 block.
      {
        cat "$A/p6-body.md"
        [ -n "$FOLLOWUP" ] && printf '\nFollow-up issue: %s\n' "$FOLLOWUP"
        printf '\n<!-- gf-stage:p6 -->\n'
        printf '<!-- gf-verdict:p6\n'
        "$PY" -c "import json,os;v=json.load(open(os.path.join(os.environ['ARTIFACTS_DIR'],'p5-verdict.json')));print(json.dumps({'schema':'gf-verdict/1','stage':'p6','pr':int('$PR'),'decision':'merge','followup':'$FOLLOWUP','p5_verdict':v.get('verdict')},indent=2))"
        printf '\n-->\n'
      } > "$A/p6-comment.md"
      gh pr comment "$PR" --repo "$REPO" --body-file "$A/p6-comment.md"

      # Phase 1 = recommend only (human merges via pr-validated). Phase 2 = auto-merge.
      if [ "${ARCHON_P6_AUTOMERGE:-0}" = "1" ]; then
        gh pr ready "$PR" --repo "$REPO" 2>/dev/null || true
        gh pr merge "$PR" --repo "$REPO" --squash --delete-branch=false \
          && echo "p6: AUTO-MERGED PR #$PR into $BASE" \
          || echo "p6: WARN auto-merge failed; left for human (marker posted, pr-validated will follow)"
      else
        echo "p6: MERGE-RECOMMENDED for PR #$PR (phase 1 — human merges). Follow-up: ${FOLLOWUP:-none}"
      fi
