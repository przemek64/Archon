        "overallSummary": "What worked, what didn't, what the generator must fix."
      }
      ```

      **`passed` is true ONLY if every score >= passThreshold.**

      **Update state.json based on result:**

      **If PASSED:**
      - Add current sprint number to `completedSprints`
      - If `sprint` < `totalSprints`: set `"phase": "negotiating"`, increment `"sprint"` by 1, set `"retry": 0`
      - If `sprint` == `totalSprints`: set `"phase": "complete"`, set `"status": "complete"`

      **If FAILED:**
      - If `retry` < `maxRetries`: set `"phase": "building"`, increment `"retry"` by 1
      - If `retry` >= `maxRetries`: set `"phase": "failed"`, set `"status": "failed"`

      Kill all background processes before finishing.

  - id: gate-gen-8-3
    depends_on: [evaluate-8-2]
    trigger_rule: all_done
    bash: |
      S="$ARTIFACTS_DIR/state.json"
      STATUS=$(sed -nE 's/.*"status"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/p' "$S" | head -1)
      SPRINT=$(sed -nE 's/.*"sprint"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$S" | head -1)
      PHASE=$(sed -nE 's/.*"phase"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/p' "$S" | head -1)
      RETRY=$(sed -nE 's/.*"retry"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$S" | head -1)
      if [ "$STATUS" = running ] && [ "$SPRINT" = 8 ] && [ "$PHASE" = building ] && [ "$RETRY" = 2 ]; then printf yes; else printf no; fi

  - id: generate-8-3
    depends_on: [gate-gen-8-3]
    trigger_rule: all_done
    when: "$gate-gen-8-3.output == 'yes'"
    provider: codex
    model: gpt-5.5
    idle_timeout: 600000
    prompt: |
      # Generator (Codex)

      You are a software engineer. Build features that MUST survive an adversarial evaluator who will
      actively try to break your code.

      **Read state**: `$ARTIFACTS_DIR/state.json` for `sprint` (=N) and `retry` (=R).

      **Read these files:**
      1. `$ARTIFACTS_DIR/spec.md` — module spec (overview, prerequisites, module surface, features)
      2. `$ARTIFACTS_DIR/contracts/sprint-{N}.json` — the contract you must satisfy
      3. The **Prerequisites** section of the spec — read those existing files under
         `$ARTIFACTS_DIR/app/` to learn the APIs/types/exports your module depends on.
      4. If `retry` > 0: read `$ARTIFACTS_DIR/feedback/sprint-{N}-round-{R-1}.json` for prior feedback

      **If this is a RETRY (retry > 0):** Read the feedback CAREFULLY. Every failed criterion must be
      addressed. If scores were close (5-6) and trending up: REFINE. If low (1-4) or fundamentally broken:
      PIVOT. Address EVERY feedback item — the evaluator WILL re-check.

      **Build rules:**
      - You are building a NEW, self-contained module inside the existing codebase at `$ARTIFACTS_DIR/app/`.
      - STRICTLY NEW FILES ONLY. Create your module's own files (in the subdirectory named in the spec).
        NEVER modify, rename, or delete any file that was part of the existing codebase — they are
        read-only prerequisites. If you think an existing file must change to integrate, do NOT change it;
        instead document the required integration in your module (e.g. a README/usage note) and design the
        module so a consumer wires it in. Verify before committing: `git diff --name-only HEAD~0` style —
        run `git status --porcelain` and confirm only NEW (`??`/added) paths in your module dir appear.
      - Build ONE feature at a time, verify it works, then commit:
        `cd $ARTIFACTS_DIR/app && git add <your-new-files> && git commit -m "feat: ..."` (never `git add -A`
        of pre-existing files; only stage files you created).
      - Install dependencies as needed. Test your code — import the module, run it, exercise its surface.
      - Build defensively — the evaluator's job is to break you (edge cases, error handling, validation).

      **Update state.json**: set `"phase": "evaluating"`. Keep all other fields unchanged.

  - id: gate-eval-8-3
    depends_on: [generate-8-3]
    trigger_rule: all_done
    bash: |
      S="$ARTIFACTS_DIR/state.json"
      STATUS=$(sed -nE 's/.*"status"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/p' "$S" | head -1)
      SPRINT=$(sed -nE 's/.*"sprint"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$S" | head -1)
      PHASE=$(sed -nE 's/.*"phase"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/p' "$S" | head -1)
      RETRY=$(sed -nE 's/.*"retry"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$S" | head -1)
      if [ "$STATUS" = running ] && [ "$SPRINT" = 8 ] && [ "$PHASE" = evaluating ] && [ "$RETRY" = 2 ]; then printf yes; else printf no; fi

  - id: evaluate-8-3
    depends_on: [gate-eval-8-3]
    trigger_rule: all_done
    when: "$gate-eval-8-3.output == 'yes'"
    provider: claude
    model: opus
    idle_timeout: 600000
    prompt: |
      # Evaluator (Opus) — ADVERSARIAL QA

      Your mandate is to BREAK what the generator built. You are not helpful, not generous. You are an attacker.

      **Read state**: `$ARTIFACTS_DIR/state.json` for `sprint` (=N), `retry` (=R), `maxRetries`, `passThreshold`.

      **CRITICAL CONSTRAINTS:**
      - READ-ONLY for source code. NEVER Write/Edit files in `$ARTIFACTS_DIR/app/`.
      - You MAY use Bash to run the app, curl endpoints, run tests.
      - Kill any background processes you start BEFORE finishing:
        `pkill -f "node|bun|python|npm|next|vite|webpack" 2>/dev/null || true`
      - Score EVERY criterion in `$ARTIFACTS_DIR/contracts/sprint-{N}.json`. No skipping.

      **Scoring:** 9-10 exceptional (handles edge cases); 7-8 solid (meets criterion); 5-6 partial (bugs/edge
      fails); 3-4 weak; 1-2 broken. Do NOT grade on a curve. Do NOT give benefit of the doubt.

      **For each criterion:** read the code, run the app, try to BREAK it (invalid inputs, missing fields,
      edge cases), score honestly.

      **Write evaluation** to `$ARTIFACTS_DIR/feedback/sprint-{N}-round-{R}.json`:
      ```json
      {
        "passed": <true if ALL scores >= passThreshold>,
        "scores": { "criterion-name": <score> },
        "feedback": [ { "criterion": "name", "score": <1-10>,
                        "details": "file paths, line numbers, exact errors, failing curl commands" } ],
        "overallSummary": "What worked, what didn't, what the generator must fix."
      }
      ```

      **`passed` is true ONLY if every score >= passThreshold.**

      **Update state.json based on result:**

      **If PASSED:**
      - Add current sprint number to `completedSprints`
      - If `sprint` < `totalSprints`: set `"phase": "negotiating"`, increment `"sprint"` by 1, set `"retry": 0`
      - If `sprint` == `totalSprints`: set `"phase": "complete"`, set `"status": "complete"`

      **If FAILED:**
      - If `retry` < `maxRetries`: set `"phase": "building"`, increment `"retry"` by 1
      - If `retry` >= `maxRetries`: set `"phase": "failed"`, set `"status": "failed"`

      Kill all background processes before finishing.

  - id: report
    depends_on: [evaluate-8-3]
    trigger_rule: all_done
    prompt: |
      You are a project reporter. Generate a comprehensive summary of the adversarial development run.

      ## Read ALL of these files:
      1. `$ARTIFACTS_DIR/state.json` — final state (success/failure, sprint count)
      2. `$ARTIFACTS_DIR/spec.md` — the original product spec
      3. All files in `$ARTIFACTS_DIR/contracts/` (use Glob)
      4. All files in `$ARTIFACTS_DIR/feedback/` (use Glob)

      ## Report:
      ### Build Summary
      - What was built, final status (all sprints passed or failed on which sprint), sprints completed vs planned.
      ### Per-Sprint Breakdown
      - Per attempted sprint: contract requirements, attempts (rounds), final scores, key driving feedback.
      ### Quality Metrics
      - Average final-round score, which criteria needed the most rounds.
      ### How to Run
      - Code lives in `$ARTIFACTS_DIR/app/`. Tech stack + start steps from the spec.

      Write the report to `$ARTIFACTS_DIR/report.md` AND output it as your response.
    allowed_tools: [Read, Write, Glob, Grep]
