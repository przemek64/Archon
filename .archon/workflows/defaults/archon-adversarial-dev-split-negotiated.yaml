      PHASE=$(sed -nE 's/.*"phase"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/p' "$S" | head -1)
      RETRY=$(sed -nE 's/.*"retry"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$S" | head -1)
      if [ "$STATUS" = running ] && [ "$SPRINT" = 1 ] && [ "$PHASE" = evaluating ] && [ "$RETRY" = 1 ]; then printf yes; else printf no; fi

  - id: evaluate-1-2
    depends_on: [gate-eval-1-2]
    trigger_rule: all_done
    when: "$gate-eval-1-2.output == 'yes'"
