      RETRY=$(sed -nE 's/.*"retry"[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' "$S" | head -1)
      if [ "$STATUS" = running ] && [ "$SPRINT" = 1 ] && [ "$PHASE" = building ] && [ "$RETRY" = 2 ]; then printf yes; else printf no; fi

